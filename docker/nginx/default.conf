# ============================================================
# Rate Limiting Zone
# ============================================================
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# ============================================================
# Security: Hide nginx version
# ============================================================
server_tokens off;

# ============================================================
# Gzip Compression
# ============================================================
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
gzip_min_length 1000;
gzip_comp_level 5;

# ============================================================
# HTTP Server Block
# SSL sudah dihandle Traefik — nginx cukup listen port 80
# ============================================================
server {
    listen 80;
    server_name _;   # terima semua domain, Traefik yang filter

    root /var/www/public;
    index index.php;
    client_max_body_size 50M;

    # [HAPUS] block redirect HTTP → HTTPS — Traefik yang handle
    # [HAPUS] block HTTPS 443 + SSL cert — Traefik yang handle
    # [HAPUS] certbot well-known — tidak diperlukan lagi

    # Security headers — tetap di sini
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------
    # Main Routing (Laravel)
    # --------------------------------------------------------
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------
    # PHP-FPM Handler
    # --------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    # --------------------------------------------------------
    # Deny Sensitive Files
    # --------------------------------------------------------
    location ~ /\.ht { deny all; }
    location ~ /\.(env|git|htaccess|htpasswd) { deny all; }
    location ~ ^/(storage|vendor|composer\.(json|lock)) { deny all; }

    # --------------------------------------------------------
    # Static Assets
    # --------------------------------------------------------
    location ~* \.(js|css|png|jpg|gif|ico|svg|woff2)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
