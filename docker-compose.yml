services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_php
    entrypoint: [ "/bin/sh", "-c", "chown -R www-data:www-data /var/www/storage ; chown -R www-data:www-data /var/www/bootstrap/cache ; chmod -R 775 /var/www/storage /var/www/bootstrap/cache ; php-fpm" ]
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME}_nginx
    restart: unless-stopped
    # [HAPUS] ports 80:80 dan 443:443 — Traefik yang handle sekarang
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # [HAPUS] certbot volumes — SSL diurus Traefik otomatis
    networks:
      - traefik_network # [TAMBAH] agar Traefik bisa routing ke container ini
      - app_network
    depends_on:
      - php
    labels:
      # [TAMBAH] semua label ini — ini yang mengatur routing Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.calapos.rule=Host(`andtech-async.my.id`) || Host(`www.andtech-async.my.id`)"
      - "traefik.http.routers.calapos.entrypoints=websecure"
      - "traefik.http.routers.calapos.tls.certresolver=letsencrypt"
      - "traefik.http.services.calapos.loadbalancer.server.port=80"

  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME}_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # [HAPUS] ports 3306:3306 — jangan pernah expose DB ke publik!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    # [TIDAK ADA PERUBAHAN] redis tetap di app_network saja
    volumes:
      - redis_data:/data
    networks:
      - app_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME}_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    volumes:
      - .:/var/www
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy
  # [HAPUS] service certbot seluruhnya — tidak diperlukan lagi
  # Traefik mengurus SSL otomatis via Let's Encrypt

volumes:
  mysql_data:
  redis_data:

networks:
  traefik_network:
    # [TAMBAH] network eksternal yang dishare dengan Traefik
    external: true
  app_network:
    driver: bridge # [TIDAK ADA PERUBAHAN] network internal antar service
